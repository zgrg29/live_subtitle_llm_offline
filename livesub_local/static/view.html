<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>LiveSub Local · 字幕</title>
<link rel="stylesheet" href="/static/subtitle.css">
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  #stage {
    position: fixed; left: 0; right: 0;
    padding: 0 var(--margin-x, 8%);
    align-items: center;
    transition: opacity var(--fade, 160ms) linear;
  }
  #stage[data-position="bottom"] { bottom: var(--margin-y, 8%); }
  #stage[data-position="top"] { top: var(--margin-y, 8%); }
  #stage.idle { opacity: 0; }
</style>
</head>
<body>
<div id="stage" class="sub-stage" data-position="bottom"></div>
<script src="/static/style.js"></script>
<script>
(function () {
  "use strict";
  var stage = document.getElementById("stage");
  var display = null;
  var lastSnapshot = null;
  var lastKey = "";
  var reconnectTimer = null;
  var idleTimer = null;

  function applyDisplay(data) {
    if (!data) return;
    LiveSubStyle.apply(stage, data);
    var margin = LiveSubStyle.clamp(data.margin_percent, 0, 45, 8);
    stage.style.setProperty("--margin-x", margin + "%");
    stage.style.setProperty("--margin-y", margin + "%");
  }

  function armIdle() {
    if (!display) return;
    if (idleTimer) clearTimeout(idleTimer);
    if (!display.clear_after_ms) { stage.classList.remove("idle"); return; }
    stage.classList.remove("idle");
    idleTimer = setTimeout(function () { stage.classList.add("idle"); }, display.clear_after_ms);
  }

  function escapeHtml(text) {
    return String(text).replace(/[&<>"']/g, function (ch) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch];
    });
  }

  function render(snapshot, force) {
    if (!display) return;
    var sentences = (snapshot.sentences || []).slice(-display.pairs);
    if (display.order === "top") sentences = sentences.slice().reverse();
    var key = sentences.map(function (item) {
      return item.id + "|" + item.source + "|" + JSON.stringify(item.translations || {});
    }).join("~") + "|" + display.order + "|" + display.show_source;
    if (!force && key === lastKey) return;
    lastKey = key;

    var html = "";
    sentences.forEach(function (sentence) {
      var target = "";
      (snapshot.targets || []).some(function (language) {
        target = sentence.translations[language] || "";
        return Boolean(target);
      });
      if (!sentence.source && !target) return;
      html += '<div class="sub-pair">';
      if (display.show_source && sentence.source) {
        html += '<div class="sub-source">' + escapeHtml(sentence.source) + "</div>";
      }
      if (target) html += '<div class="sub-target">' + escapeHtml(target) + "</div>";
      html += "</div>";
    });

    stage.innerHTML = html;
    if (html) armIdle(); else stage.classList.add("idle");
  }

  function connect() {
    var scheme = location.protocol === "https:" ? "wss" : "ws";
    var socket = new WebSocket(scheme + "://" + location.host + "/v1/view");
    socket.onmessage = function (event) {
      var payload;
      try { payload = JSON.parse(event.data); } catch (err) { return; }
      if (payload.display) {
        display = payload.display;
        applyDisplay(display);
      }
      if (payload.type === "snapshot") {
        lastSnapshot = payload;
        render(payload, true);
        return;
      }
      if (payload.type === "idle") {
        lastSnapshot = null;
        lastKey = "";
        stage.innerHTML = "";
        stage.classList.add("idle");
      }
    };
    socket.onclose = function () {
      if (reconnectTimer) return;
      reconnectTimer = setTimeout(function () { reconnectTimer = null; connect(); }, 1000);
    };
  }

  fetch("/api/display").then(function (response) { return response.json(); }).then(function (data) {
    display = data;
    applyDisplay(display);
    connect();
  }).catch(function () {
    setTimeout(function () { location.reload(); }, 1500);
  });
})();
</script>
</body>
</html>
