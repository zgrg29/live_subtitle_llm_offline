# LiveSub Local 設定ファイル
#
# 使い方：このファイルを config.toml にコピーしてから start.bat を実行します。
#   copy config.example.toml config.toml
#
# ※ API キーはこのファイルではなく api.toml に書きます（雛形は api.example.toml）。
# config.toml は .gitignore 済みなのでコミットされません。

[server]
# 127.0.0.1 のみで待ち受けます。0.0.0.0 には変えないでください（LAN に公開されます）。
host = "127.0.0.1"
# ブラウザと OBS がアクセスするポート
port = 8765
# 起動したらブラウザを自動で開く
open_browser = true

[subtitle]
# 【この版では固定】コントロールパネルは「日本語 → 中国語」専用です。
# 以下 2 行はサーバー側の初期値で、通常は変更不要です。
# 認識言語：ja=日本語 zh=中国語 en=英語 ko=韓国語
source_language = "ja"
# 訳文の言語（複数可：target_languages = ["zh", "en"]）
target_languages = ["zh"]
# 保持する文数（超えたら古い文から捨てる）
max_sentences = 100
# 翻訳リクエスト間の最小間隔（ミリ秒）。レート制限対策
min_interval_ms = 120
# auto = キーがあれば Qwen、なければ mock / qwen = 強制 / mock = ダミー翻訳
engine = "auto"

[display]
# 字幕スタイル。コントロールパネルで変更すると settings.json に保存され、こちらより優先されます。
# 元に戻すには settings.json を削除するか、パネルの「既定に戻す」を押します。
# フォント：ブラウザと OBS の両方に入っているものをカンマ区切りで
font_family = '"Hiragino Sans", "Yu Gothic UI", "Noto Sans JP", "Microsoft YaHei", sans-serif'
# 訳文の文字サイズ / 原文の文字サイズ（px、1920x1080 基準）
target_size = 44
source_size = 26
# 文字色 / 縁取りの色 / 縁取りの太さ
target_color = "#ffffff"
source_color = "#b9c6d4"
outline_color = "#000000"
outline_width = 4
# 字幕の背景色と不透明度（0 = 完全に透明）
background_color = "#000000"
background_alpha = 0
# 表示位置：bottom / top
position = "bottom"
# 同時に表示する文数（現在の文を含む、2〜6）
pairs = 3
# 並び順：bottom = 新しい文が下 / top = 新しい文が上
order = "bottom"
# 画面端からの距離（％、0〜45）
margin_percent = 8
# 文と文の間隔（px、0〜40）
line_gap = 10
# 新しい字幕が来ないときに消すまでの時間（ミリ秒、0〜30000、0 = 消さない）
clear_after_ms = 5000
# フェード時間（ミリ秒）
fade_ms = 160
# 原文を表示するか
show_source = true
