# Qwen API 設定の雛形 — このファイルは GitHub にコミットできます
#
# 使い方：
#   1. このファイルを api.toml にコピーします
#        copy api.example.toml api.toml
#   2. メモ帳で api.toml を開き、qwen.api_key に自分のキーを入れます
#   3. start.bat を実行し直します
#
# api.toml は .gitignore 済みでコミットされません。api.example.toml には実際のキーは入っていません。
# api.toml をスクリーンショットに撮らない、チャットやグループに貼らない、クラウドに上げない。

[qwen]
# アリババクラウド百錬（DashScope）コンソール → API-KEY。形式は sk-xxxxxxxxxxxxxxxx
api_key = ""
# リージョン：cn = 中国本土（北京）/ intl = 海外（シンガポール）
# API キーはリージョンごとに発行されます。海外アカウントのキーは intl を選んでください。
# コントロールパネルからも切り替えられます（settings.json に保存）。
region = "cn"
model = "qwen-mt-flash"
# 1 文あたりのタイムアウト（秒）
timeout_s = 10
# 専用デプロイを使う場合だけ、下の行を有効にして URL を指定します。
# endpoint = "https://your-endpoint.example.com/v1/chat/completions"
